[package]
name = "skill-manager"
version = "0.1.0"
description = "Agent Skill Manager - manage skills mounted by AI coding agents"
authors = ["caozeal"]
edition = "2021"

[lib]
name = "skill_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"
thiserror = "2"
dirs = "6"

[profile.release]
strip = true
lto = true
